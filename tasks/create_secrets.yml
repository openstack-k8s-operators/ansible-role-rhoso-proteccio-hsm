- name: Prepare Proteccio HSM secrets
  block:
    - name: Prepare private working directory
      ansible.builtin.include_tasks: prepare_working_dir.yml

    - name: Create working directories
      ansible.builtin.file:
        path: "{{ working_dir }}/certs"
        state: directory
        mode: "0700"

    - name: Get certs, keys and proteccio.rc
      no_log: true
      block:
        - name: Get client certificate and key
          ansible.builtin.get_url:
            url: "{{ item }}"
            dest: "{{ working_dir }}/certs/"
            mode: "0600"
          loop:
            - "{{ proteccio_client_crt_src }}"
            - "{{ proteccio_client_key_src }}"

        - name: Get server certificates
          ansible.builtin.get_url:
            url: "{{ item }}"
            dest: "{{ working_dir }}/certs/"
            mode: "0600"
          loop: "{{ proteccio_server_crt_src }}"

        - name: Get proteccio.rc
          ansible.builtin.get_url:
            url: "{{ proteccio_conf_src }}"
            dest: "{{ working_dir }}/proteccio.rc"
            mode: "0600"

    - name: List all certificate and key files
      no_log: true
      ansible.builtin.set_fact:
        proteccio_crt_files: "{{ lookup('fileglob', working_dir + '/certs/*', wantlist=True) }}"

    - name: Create the HSM cert secret
      no_log: true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
        PATH: "{{ oc_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      ansible.builtin.command:
        cmd: oc apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'proteccio_data_secret.yml.j2') }}"

    - name: Create the hsm-login secret
      no_log: true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
        PATH: "{{ oc_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      ansible.builtin.command:
        cmd: oc apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'login_secret.yml.j2') }}"

  always:
    - name: Perform cleanup tasks
      when: cleanup | bool
      block:
        - name: Remove the working directory
          become: true
          ansible.builtin.file:
            path: "{{ working_dir }}"
            state: absent
          when: working_dir | default('') | length > 0
